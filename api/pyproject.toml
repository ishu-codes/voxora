[project]
name = "voxora-api"
version = "0.1.0"
description = "Real-time, low-latency voice AI backend for Voxora"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
