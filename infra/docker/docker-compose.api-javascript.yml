# Standalone stack for testing api-javascript only.
# Contains exactly its requirements: PostgreSQL + api-javascript.
#   docker compose -f docker-compose.api-javascript.yml --env-file=../../.env up -d --build
# Or from the repo root: make api-javascript-up
name: ragify-api-javascript

services:
  db:
    container_name: ragify-api-javascript-db
    image: docker.io/library/postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragify}
      POSTGRES_DB: ${POSTGRES_DB:-ragify}
    volumes:
      - api_javascript_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragify} -d ${POSTGRES_DB:-ragify}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-javascript:
    container_name: ragify-api-javascript
    build:
      context: ../../api-javascript
      dockerfile: Dockerfile
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ragify}:${POSTGRES_PASSWORD:-ragify}@db:5432/${POSTGRES_DB:-ragify}
      JWT_SECRET: ${JWT_SECRET:-super-secret-code}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-180}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_PATH: storage/workspaces
      # rag gRPC server is not part of this stack; reach one on the host if needed.
      RAGIFY_GRPC_ENDPOINT: ${RAGIFY_GRPC_ENDPOINT:-host.docker.internal:50051}
    ports:
      - "${API_JAVASCRIPT_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../api-javascript/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_javascript_db_data:
