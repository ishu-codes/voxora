name: voxora

services:
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Voxora}
      VERSION: ${VERSION:-0.1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GNANI_API_KEY: ${GNANI_API_KEY:-}
      SARVAM_WS_URL: ${SARVAM_WS_URL:-wss://api.sarvam.ai}
      STT_MODEL: ${STT_MODEL:-saaras:v3-realtime}
      STT_LANGUAGE: ${STT_LANGUAGE:-en-IN}
      STT_STREAM_TYPE: ${STT_STREAM_TYPE:-fast}
      STT_MODE: ${STT_MODE:-transcribe}
      GNANI_STT_MODEL: ${GNANI_STT_MODEL:-prisma-v2.5}

      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-320}

      TTS_MODEL: ${TTS_MODEL:-bulbul:v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-sarvam}
      TTS_VOICE: ${TTS_VOICE:-shubh}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-en-IN}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-22050}
      TTS_SPEED: ${TTS_SPEED:-1.0}
      TTS_TEMPERATURE: ${TTS_TEMPERATURE:-0.6}
      GNANI_TTS_MODEL: ${GNANI_TTS_MODEL:-timbre-v2.5}

      RATE_LIMIT_ENABLED: "true"
      REQUIRE_BROWSER_CLIENT: "true"
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ALLOWED_UNLIMITED: ${ALLOWED_UNLIMITED:-}
      RATE_LIMIT_MAX_SESSION_SECONDS: ${RATE_LIMIT_MAX_SESSION_SECONDS:-900}
      PLATFORM_MAX_TURNS: ${PLATFORM_MAX_TURNS:-10}
      RATE_LIMIT_PLATFORM_TURNS_HOUR: ${RATE_LIMIT_PLATFORM_TURNS_HOUR:-10}
      RATE_LIMIT_PLATFORM_TURNS_DAY: ${RATE_LIMIT_PLATFORM_TURNS_DAY:-240}
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
