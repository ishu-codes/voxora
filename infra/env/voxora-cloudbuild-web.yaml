substitutions:
  _API_URL: "https://invalid.example"
  _IMAGE: "invalid/image:latest"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

timeout: 1800s
